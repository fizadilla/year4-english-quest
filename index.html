<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 4 English Quest</title><style>body{font-family:Arial,sans-serif;background:#eff3ff;color:#18254b;margin:0;padding:18px}.card{max-width:650px;margin:25px auto;background:white;padding:26px;border-radius:20px;box-shadow:0 6px 25px #17255417}h1{text-align:center}.sub{text-align:center;color:#52617b}button,input{font:inherit;border-radius:11px;padding:12px}input{width:95%;border:2px solid #b8c6e0}button{border:0;background:#4148ba;color:white;cursor:pointer;font-weight:bold}.wide{width:100%;margin-top:12px}.opt{width:100%;text-align:left;background:#f5f7ff;color:#18254b;border:2px solid #d9e0f4;margin-top:10px}.opt:hover{border-color:#4148ba}.selected{background:#dce6ff;border-color:#4148ba}.muted{color:#53617d}.error{color:#b91c1c}.hidden{display:none}.bar{background:#e1e6f6;height:9px;border-radius:8px;overflow:hidden}.fill{background:#4148ba;height:100%;width:0}.tag{font-size:14px;font-weight:bold;color:#4148ba}.review{padding:12px 0;border-top:1px solid #ddd}.correct{color:#16803d}.wrong{color:#b91c1c}#result{word-wrap:break-word}</style></head><body><main class="card"><section id="start"><h1>🏆 Year 4 English Quest</h1><p class="sub">15 questions • 150 points • Play at home</p><p><label for="name"><b>Your name or pupil code</b></label></p><input id="name" maxlength="60" placeholder="Enter your name or code" autocomplete="off"><button id="startButton" class="wide">Start Adventure →</button><p class="muted">Complete all questions to see your result.</p><p class="error" id="startError"></p></section><section id="game" class="hidden"><div class="tag" id="level"></div><p id="progressText"></p><div class="bar"><div class="fill" id="fill"></div></div><h1 id="emoji"></h1><h2 id="question"></h2><div id="choices"></div><button class="wide" id="next" disabled>Next →</button></section><section id="result" class="hidden"><h1>🎉 Quest Complete!</h1><p id="resultName"></p><h1 id="score"></h1><p id="summary"></p><div id="formArea"><p><b>Score submission</b></p><p class="muted" id="submitStatus" role="status" aria-live="polite">Preparing to send your result…</p><button class="wide hidden" id="send">Open Score Form to submit manually →</button><p class="muted">Your teacher can check the Google Sheet to confirm receipt.</p><p id="formHelp" class="error"></p></div><h2>Answer Review</h2><div id="review"></div><button class="wide" id="restart">Play Again ↻</button></section></main><script>
// TEACHER SETUP: Replace the empty value with the Google Form pre-filled URL.
// See README.txt for how to create the pre-filled link.
const PREFILLED_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSeqkfiOt5MVd3No10C12cZYpUKuwGTcSSR4VRGkBIuEjFeTlA/viewform?usp=pp_url&entry.1401071325=TEST&entry.1929046681=10&entry.539665780=100';
const FORM_RESPONSE_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSeqkfiOt5MVd3No10C12cZYpUKuwGTcSSR4VRGkBIuEjFeTlA/formResponse';
const questions=[
['🪥','My brother _____ his teeth every morning.',['brush','brushes','brushing'],1,'Use brushes with he, she or it.'],
['🐱','Look! The cat _____ up the tree.',['climbs','climb','is climbing'],2,'Look! suggests an action happening now.'],
['🥛','There _____ some milk in the fridge.',['is','are','am'],0,'Milk is uncountable, so use is.'],
['🍎','We have got _____ apples.',['any','some','much'],1,'Some is used in this positive sentence.'],
['📅','My birthday is _____ August.',['on','at','in'],2,'Use in with months.'],
['🚌','Yesterday, we _____ to school by bus.',['go','went','goes'],1,'Went is the past tense of go.'],
['📚','How _____ books are on the shelf?',['much','many','any'],1,'Use many with countable plural nouns.'],
['👟','These are Sara’s shoes. They are _____ shoes.',['her','his','their'],0,'Her shows that the shoes belong to Sara.'],
['⚽','The children _____ football right now.',['plays','are playing','played'],1,'Right now signals the present continuous.'],
['🐘','An elephant is _____ than a goat.',['big','biggest','bigger'],2,'Use bigger than to compare two things.'],
['🏅','Ali is the _____ runner in his class.',['fastest','faster','fast'],0,'Use fastest to compare someone with a group.'],
['🍞','My father _____ some bread yesterday.',['buys','bought','buy'],1,'Bought is the past tense of buy.'],
['🏸','I like badminton _____ it is exciting.',['but','or','because'],2,'Because introduces a reason.'],
['🎬','This film is _____ than the other film.',['more exciting','most exciting','exciting'],0,'Use more exciting than to compare two films.'],
['🚲','When I was five, I _____ ride a bicycle.',['can','could','am'],1,'Could describes ability in the past.']
];let items=[],pos=0,answers=[],name='';const $=id=>document.getElementById(id);function view(id){['start','game','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function render(){let q=items[pos];$('level').textContent=pos<5?'🌱 Easy':pos<10?'⚡ Medium':'🔥 Challenge';$('progressText').textContent='Question '+(pos+1)+' of 15';$('fill').style.width=(pos/15*100)+'%';$('emoji').textContent=q[0];$('question').textContent=q[1];$('choices').replaceChildren();q[2].forEach((v,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+v;b.onclick=()=>{answers[pos]=i;Array.from($('choices').children).forEach((c,j)=>c.classList.toggle('selected',i===j));$('next').disabled=false};$('choices').appendChild(b)});$('next').disabled=true;$('next').textContent=pos===14?'See My Results →':'Next Question →'}$('startButton').onclick=()=>{name=$('name').value.trim();if(name.length<2){$('startError').textContent='Please enter at least two characters.';return}items=[...questions];for(let i=items.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}answers=[];pos=0;view('game');render()};$('next').onclick=()=>{if(answers[pos]===undefined)return;pos++;if(pos<15){render();return}finish()};function finish(){view('result');let correct=items.reduce((n,q,i)=>n+(q[3]===answers[i]?1:0),0),score=correct*10,percent=Math.round(correct/15*100);$('resultName').textContent='Player: '+name;$('score').textContent=score+' / 150 points';$('summary').textContent=correct+' correct out of 15 ('+percent+'%)';let rev=$('review');rev.replaceChildren();items.forEach((q,i)=>{let d=document.createElement('div');d.className='review';let title=document.createElement('b');title.textContent=(i+1)+'. '+q[1];let p=document.createElement('p');p.className=answers[i]===q[3]?'correct':'wrong';p.textContent=(answers[i]===q[3]?'✓ Correct':'✗ Incorrect')+' — '+q[2][q[3]];let small=document.createElement('p');small.className='muted';small.textContent=q[4];d.append(title,p,small);rev.appendChild(d)});submitScore(name,correct,score);$('send').onclick=()=>{if(!PREFILLED_FORM_URL){$('formHelp').textContent='The teacher has not connected the Google Form yet.';return}try{const u=new URL(PREFILLED_FORM_URL);u.searchParams.set('entry.1401071325',name);u.searchParams.set('entry.1929046681',String(correct));u.searchParams.set('entry.539665780',String(score));window.open(u.toString(),'_blank','noopener,noreferrer')}catch(e){$('formHelp').textContent='The Google Form link is not valid.'}}} $('restart').onclick=()=>view('start');

// Submit to Google Forms in a hidden iframe. Browsers do not expose the
// cross-origin response, so submission cannot be verified from the game.
function submitScore(pupil,correct,score){
  const status=$('submitStatus'),fallback=$('send');
  status.textContent='Sending your score to your teacher…';
  fallback.classList.remove('hidden');
  try{
    const frame=document.createElement('iframe');
    frame.name='quest_form_'+Date.now();
    frame.title='Background score submission';
    frame.style.display='none';
    document.body.appendChild(frame);
    const form=document.createElement('form');
    form.method='POST';form.action=FORM_RESPONSE_URL;form.target=frame.name;
    form.style.display='none';
    const fields={'entry.1401071325':pupil,'entry.1929046681':String(correct),'entry.539665780':String(score)};
    for(const [key,value] of Object.entries(fields)){
      const input=document.createElement('input');input.type='hidden';input.name=key;input.value=value;form.appendChild(input);
    }
    document.body.appendChild(form);
    form.submit();
    status.textContent='Score submission requested automatically. Your teacher can confirm it in Google Sheets. If it does not appear, use the button below.';
    form.remove();
  }catch(err){
    status.textContent='Automatic submission could not start. Please use the button below.';
  }
}
</script></body></html>
